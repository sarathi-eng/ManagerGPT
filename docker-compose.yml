services:
  backend:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./managerGPT.db:/app/managerGPT.db

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE: http://backend:8001
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
    depends_on:
      - backend
